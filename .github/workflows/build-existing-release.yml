name: Build Existing Release Asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach binary to"
        required: true
        default: "v0.2.4"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build PyInstaller binary
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller \
            --onefile wifi_api_server.py \
            --hidden-import fastapi \
            --hidden-import uvicorn \
            --hidden-import pydantic \
            --hidden-import pydantic_core \
            --hidden-import starlette \
            --hidden-import anyio \
            --hidden-import multipart
          mkdir -p release
          cp dist/wifi_api_server release/wifi_api_server-amd64
          chmod +x release/wifi_api_server-amd64
          ls -lh release/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: release/*
          draft: false
          make_latest: true
